name: Research checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python fruits/001-A000181/check.py
          python fruits/002-A384700/check.py
          python fruits/003-A263160/check.py
          python fruits/004-A338020/check.py
          python fruits/005-A397045/check.py
  lean-draft-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
