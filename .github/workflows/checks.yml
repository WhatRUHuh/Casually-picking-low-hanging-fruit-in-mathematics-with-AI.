name: Research checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python fruits/001-A000181/check.py
          python fruits/002-A384700/check.py
          python fruits/003-A263160/check.py
          python fruits/004-A338020/check.py
          python fruits/005-A397045/check.py
  lean-draft-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Lake dependencies
        run: lake update
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: '1'
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Compile Lean drafts
        run: lake build
