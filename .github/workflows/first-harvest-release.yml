name: First harvest release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/first-harvest-release.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.1.0 if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.1.0 --repo "$GITHUB_REPOSITORY" --target 9b151ddd285063aa7635c34549aad8901c160efc --title "🍎 The First Harvest — Five Mathematical Fruits" --notes "Five candidate mathematical arguments generated by GPT-6.2 through casual, open-ended exploration. The five research turns displayed thinking times of 55, 35, 53, 25 and 55 seconds; these are not end-to-end proof or verification times. Includes research notes, Python checks, Lean drafts and research provenance. Python CI passed; Lean CI failed and no full Lean verification, independent review or priority confirmation is claimed."
